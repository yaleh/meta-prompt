[tool.poetry]
name = "meta-prompt"
version = "0.1.0"
description = "This package generates high quality prompts with input and expected output examples."
authors = ["Yale Huang <calvino.huang@gmail.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.10"
langgraph = "^0.1.5"
langchain = "^0.2.6"
langchain-openai = "^0.1.14"
pydantic = "^2.8.2"
python-json-logger = "^2.0.7"
parameterized = "^0.9.0"
mesop = "^0.12.5"
func-timeout = "^4.3.5"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
datasets = "^2.20.0"
ipykernel = "^6.29.5"
ruff = "^0.12.0"
gradio = "^4.37.2"
confz = "^2.0.1"
pytest-cov = "^6.2.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
